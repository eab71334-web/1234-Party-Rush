      - name: Export APK (release)
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-release "Android" build/TowerWars.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-android
          path: build/TowerWars.apk
          compression-level: 9
          retention-days: 3
