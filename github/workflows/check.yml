name: Check scripts

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.0
          use-dotnet: false
          include-templates: false

      - name: Check scripts
        run: |
          godot --headless --path . res://check.tscn --quit-after 300 2>&1 | tee check.log || true
          echo "=== errors ==="
          grep -E "FAIL|SCRIPT ERROR|Parse Error|Compile Error|at: GDScript" check.log | head -80 || true
          echo "=== summary ==="
          grep "DONE" check.log || true
